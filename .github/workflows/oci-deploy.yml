name: OCI deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: userfront-oci-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_BASE_URL || 'https://userapi.itplace.click/' }}
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
      NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_KAKAO_REDIRECT_URI || 'https://userapi.itplace.click/oauth2/authorization/kakao' }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'noreply.itplace@gmail.com' }}
      NEXT_PUBLIC_BENEFIT_CHAT_ENABLED: ${{ vars.NEXT_PUBLIC_BENEFIT_CHAT_ENABLED || 'true' }}
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require Kakao JavaScript key
        run: test -n "$NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/deploy-userfront.test.sh
      - run: npm run build
      - run: npm run test:production:standalone

  deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require Kakao JavaScript key
        env:
          KAKAO_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
        run: test -n "$KAKAO_KEY"
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/eddie-backdev/itplace-user-front:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_BASE_URL=${{ vars.NEXT_PUBLIC_APP_BASE_URL || 'https://userapi.itplace.click/' }}
            NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY=${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
            NEXT_PUBLIC_KAKAO_REDIRECT_URI=${{ vars.NEXT_PUBLIC_KAKAO_REDIRECT_URI || 'https://userapi.itplace.click/oauth2/authorization/kakao' }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'noreply.itplace@gmail.com' }}
            NEXT_PUBLIC_BENEFIT_CHAT_ENABLED=${{ vars.NEXT_PUBLIC_BENEFIT_CHAT_ENABLED || 'true' }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
      - name: Deploy over SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp -i ~/.ssh/oci_key scripts/deploy-userfront.sh "$OCI_USER@$OCI_HOST:/home/ubuntu/app/scripts/deploy-userfront.sh"
          scp -i ~/.ssh/oci_key infra/oci/userfront-upstream.conf.template "$OCI_USER@$OCI_HOST:/home/ubuntu/app/nginx/conf.d/userfront-upstream.conf.template"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/oci_key "$OCI_USER@$OCI_HOST" \
            "chmod +x /home/ubuntu/app/scripts/deploy-userfront.sh && /home/ubuntu/app/scripts/deploy-userfront.sh '$IMAGE_TAG' '$GHCR_USERNAME'"
