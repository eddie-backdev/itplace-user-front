server {
    listen 80;
    server_name itplace.click www.itplace.click;
    return 301 https://itplace.click$request_uri;
}

server {
    listen 443 ssl;
    server_name www.itplace.click;

    ssl_certificate /etc/ssl/certs/itplace.pem;
    ssl_certificate_key /etc/ssl/private/itplace.key;

    return 301 https://itplace.click$request_uri;
}

server {
    listen 443 ssl;
    server_name itplace.click;

    ssl_certificate /etc/ssl/certs/itplace.pem;
    ssl_certificate_key /etc/ssl/private/itplace.key;

    add_header X-ITPLACE-Origin oci always;

    location / {
        proxy_pass http://userfront_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
